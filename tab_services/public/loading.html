<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODC - 启动中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Logo */
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(22, 119, 255, 0.18);
    }

    .logo svg {
      width: 30px;
      height: 30px;
    }

    /* Spinner */
    .spinner-wrap {
      width: 32px;
      height: 32px;
      position: relative;
    }

    .spinner-wrap svg {
      width: 100%;
      height: 100%;
      animation: rotate 1.2s linear infinite;
    }

    .spinner-wrap svg circle {
      stroke: #1677ff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 70;
      stroke-dashoffset: 50;
      fill: none;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* Text */
    .text {
      color: #8c8c8c;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-align: center;
      line-height: 1.6;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
      100%{ content: ''; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="rgba(255,255,255,0.3)"/>
        <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1.5 9l-3-3 1.06-1.06L10.5 12.88l4.94-4.94L16.5 9l-6 6z" fill="white"/>
      </svg>
    </div>
    <div class="spinner-wrap">
      <svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="12"/>
      </svg>
    </div>
    <div class="text">
      数据库开发者中心正在启动中，请耐心等待<span class="dots"></span>
    </div>
  </div>
</body>
</html>
